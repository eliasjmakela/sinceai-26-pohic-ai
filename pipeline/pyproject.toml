[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fullload"
version = "0.1.0"
description = "FullLoad pipeline: precomputes the demo bundle from the Europress starter kit data. See PRODUCT.md."
requires-python = ">=3.11"
# The starter kit (europress-smart-material-value-engine) is NOT listed here: it is not on PyPI.
# Install it first:  pip install -e resources/Europress_SMART_Material_Value_Engine_v1.0.1
# It brings pandas, pyarrow, duckdb, pyyaml.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fullload = "fullload.cli:main"

[tool.setuptools.packages.find]
include = ["fullload*"]

[tool.setuptools.package-data]
fullload = ["params.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B"]
