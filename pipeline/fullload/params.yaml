# Every HYPOTHETICAL parameter of the OpenWeight model lives here, each with a rationale line.
# Nothing in this file is a Europress price, cost or adoption figure. Values are filled in as the
# market simulation and business case are built (PRODUCT.md §3, §6). Owner of the values: business-case teammate.
#
# Format:
#   name:
#     value: <number or list for sensitivity>
#     unit: <unit>
#     rationale: <one line: why this value>
market:   # PLACEHOLDER values until the business-case teammate signs them off (PRODUCT.md §9)
  cost_share:
    value: 0.80
    unit: share of today's price
    rationale: placeholder; operator's cost to serve as a share of what it charges today (incumbent markup 25 % on cost)
  min_margin:
    value: 0.08
    unit: share of cost
    rationale: placeholder; the lowest margin an operator accepts in a competitive tender
  risk_z:
    value: 1.0
    unit: standard deviations
    rationale: placeholder; an operator prices in one standard deviation of volume-forecast error
  new_entrants:
    value: 1
    unit: count
    rationale: placeholder; operators from outside the region that bid once OpenWeight data is available
  entrant_cost_advantage:
    value: 0.05
    unit: share of cost
    rationale: placeholder; a new, efficiency-driven operator (e.g. subcontractor-based) runs 5 % cheaper
  cost_spread:
    value: 0.06
    unit: share of cost
    rationale: placeholder; operators' cost for the same account differs by up to ±6 % (route fit, depot distance)
  density_benefit:
    value: 0.10
    unit: share of cost at 100 % regional share
    rationale: placeholder; denser routes make an operator with a large regional share cheaper (a real advantage, kept after OpenWeight)
  europress_fee_eur_per_t:
    value: 2.6
    unit: EUR per tonne (operator's cost of the service)
    rationale: decided fee of EUR 20 per device per month = EUR 240 per year / 92.6 t per device-year
  sigma_sensor:
    value: 0.02
    unit: relative 1-sigma
    rationale: placeholder until Part 1 v2 lands; systematic sensor error added to the forecast error after OpenWeight

pricing:   # the operator fee decision (PRICING.md, pipeline/fullload/pricing.py). HYPOTHETICAL unless stated.
  years:
    value: 10
    unit: years
    rationale: same horizon as the team document's cash-flow model (LIITE §6.3)
  discount_rate:
    value: 0.08
    unit: per year
    rationale: team document (LIITE §6.3), ordinary corporate rate
  ramp_years:
    value: 4
    unit: years
    rationale: operator adoption grows linearly to the paying share in 4 years (LIITE §6.3)
  new_units_per_year:
    value: 1200
    unit: units
    rationale: Europress factory output, ~1,200 compactors a year (Tommi, LIITE L6); every new unit gets H7
  adoption:
    value: 0.6
    unit: share of weighed units
    rationale: team document (LIITE §6.3), a guess; the second most sensitive input
  platform_eur_per_unit_year:
    value: 26
    unit: EUR per weighed unit per year
    rationale: team document (LIITE §6.3), data and language model
  fixed_cost_eur_per_year:
    value: 400000
    unit: EUR per year
    rationale: team document (LIITE §6.3), ~3 developers, cloud, partner manager
  package_eur:
    value: 500
    unit: EUR per tender package
    rationale: team document (LIITE §6.3), ~20 % of the profit of one won contract
  bidders:
    value: 2.5
    unit: operators buying a package per tender
    rationale: team document (LIITE §6.3), a guess
  tender_share:
    value: 0.35
    unit: share of contracts tendered with OpenWeight
    rationale: team document (LIITE §6.3), a guess
  tender_interval_years:
    value: 3
    unit: years
    rationale: contracts retendered about every 3 years (Tommi)
  sales_growth:
    value: 0.05
    unit: share of new units
    rationale: team document and business team, +5 % machine sales, a guess
  device_price_eur:
    value: 22500
    unit: EUR
    rationale: basic COMBI EUR 20-25k (Tommi)
  device_margin:
    value: 0.25
    unit: share
    rationale: team document and business team, a guess
  fees_eur_per_month:
    value: [15, 20, 25, 30]
    unit: EUR per device per month
    rationale: the two candidates (EUR 20 business team, EUR 30 team document) and their neighbours
  operator_cost_per_visit_eur:
    value: [60, 116]
    unit: EUR
    rationale: operator's own cost of an avoidable visit (truck + driver); LIITE §1.2 corrected range
  operator_value_team_eur:
    value: 1360
    unit: EUR per device per year
    rationale: team document's operator gain ~EUR 1,400 with the corrected visit value (LIITE §9, 1,330-1,390)
  operator_margin_pct:
    value: [2.7, 8.0]
    unit: percent of revenue
    rationale: observed operating margins 2025, Stena Recycling 2.7 %, L&T 8.0 % (LIITE §6.2)
