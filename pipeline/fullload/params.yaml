# Every HYPOTHETICAL parameter of the FullLoad model lives here, each with a rationale line.
# Nothing in this file is a Europress price, cost or adoption figure. Values are filled in as the
# market simulation and business case are built (PRODUCT.md §3, §6). Owner of the values: business-case teammate.
#
# Format:
#   name:
#     value: <number or list for sensitivity>
#     unit: <unit>
#     rationale: <one line: why this value>
market:   # PLACEHOLDER values until the business-case teammate signs them off (PRODUCT.md §9)
  cost_share:
    value: 0.80
    unit: share of today's price
    rationale: placeholder; operator's cost to serve as a share of what it charges today (incumbent markup 25 % on cost)
  min_margin:
    value: 0.08
    unit: share of cost
    rationale: placeholder; the lowest margin an operator accepts in a competitive tender
  risk_z:
    value: 1.0
    unit: standard deviations
    rationale: placeholder; an operator prices in one standard deviation of volume-forecast error
  new_entrants:
    value: 1
    unit: count
    rationale: placeholder; operators from outside the region that bid once FullLoad data is available
  entrant_cost_advantage:
    value: 0.05
    unit: share of cost
    rationale: placeholder; a new, efficiency-driven operator (e.g. subcontractor-based) runs 5 % cheaper
  cost_spread:
    value: 0.06
    unit: share of cost
    rationale: placeholder; operators' cost for the same account differs by up to ±6 % (route fit, depot distance)
  density_benefit:
    value: 0.10
    unit: share of cost at 100 % regional share
    rationale: placeholder; denser routes make an operator with a large regional share cheaper (a real advantage, kept after FullLoad)
  europress_fee_eur_per_t:
    value: 3.0
    unit: EUR per verified tonne
    rationale: placeholder; FullLoad service fee paid by the operator
  sigma_sensor:
    value: 0.02
    unit: relative 1-sigma
    rationale: placeholder until Part 1 v2 lands; systematic sensor error added to the forecast error after FullLoad
business:   # business team assumptions (message of 7 Nov; scripts pending in analysis/business/). HYPOTHETICAL.
  devices_total:
    value: 10000
    unit: devices
    rationale: business team; roughly the installed base Tommi mentioned
  paying_coverage:
    value: 0.5
    unit: share of devices
    rationale: business team; half of the devices are served by an operator that pays for FullLoad
  fee_mode:
    value: per_device_month
    unit: per_device_month | per_tonne
    rationale: open decision (PRODUCT.md §1 says per verified tonne; business team models per device per month)
  fee_eur_per_device_month:
    value: 20
    unit: EUR per device per month
    rationale: business team; within 10-30 % of the operator's avoided pricing risk; Enevo charged EUR 10-14
  fee_eur_per_t:
    value: 3.0
    unit: EUR per verified tonne
    rationale: same order as EUR 20/month at the fleet's tonnes per device-year
  t0_share:
    value: 1.0
    unit: share of devices
    rationale: business team; software-only virtual weight on every device
  t0_cost_eur:
    value: 0
    unit: EUR per device
    rationale: business team (Part 1 v2 installed cost factory-fit EUR 10-125)
  h1_share:
    value: 0.3
    unit: share of devices
    rationale: business team; hopper weighing where accuracy is worth the money
  h1_cost_eur:
    value: 500
    unit: EUR per device
    rationale: business team (Part 1 v2 installed cost factory-fit EUR 548-2,363)
  opex_eur_per_device_year:
    value: 74
    unit: EUR per device per year
    rationale: business team; EUR 0.74 M per year for 10,000 devices
  sales_growth:
    value: 0.05
    unit: share
    rationale: business team; extra machine sales from operators promoting weighing-capable Europress machines
  device_price_eur:
    value: 22500
    unit: EUR
    rationale: business team; basic COMBI EUR 20-25k (Tommi)
  device_margin:
    value: 0.25
    unit: share
    rationale: business team
  renewal_years:
    value: 6
    unit: years
    rationale: business team; machines renewed every 6 years (lease period)
  horizon_years:
    value: 6
    unit: years
    rationale: one lease period
